<title>DQH AL-HUDA • Administrasi Santri</title>
<style>

*{box-sizing:border-box;margin:0;padding:0;font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif}
html,body{overflow-x:hidden;overscroll-behavior-x:none}

button{cursor:pointer;border:none;background:none;font-family:inherit;color:inherit}
input,select,textarea{font-family:inherit}
svg{display:block}
:focus-visible{outline:3px solid rgba(247,103,7,.5);outline-offset:2px;border-radius:8px}
.grid-2>*,.grid-eq>*,.bill-card>*,.tl-top>*,.prof-row>*,.wh-top>*,.wh-card>*,.mcard>*{min-width:0}
.logo-box{position:relative;display:inline-block;overflow:hidden;background:#fff}

.logo-box .logo-fb{display:none;width:100%;height:100%}
.logo-box.img-failed img{display:none}
.logo-box.img-failed .logo-fb{display:block}
.splash-logo{width:112px;height:112px;border-radius:26px;padding:10px;display:block;margin:0 auto 14px;box-shadow:0 16px 40px rgba(0,0,0,.28)}
.login-logoimg{width:148px;height:148px;display:block;margin:0 auto;background:transparent}

.wt-logo{width:38px;height:38px;min-width:38px;border:1px solid var(--line);border-radius:11px;padding:4px}
.sb-logo{width:38px;height:38px;min-width:38px;border-radius:11px;padding:5px}
.ah-logo{width:36px;height:36px;min-width:36px;border-radius:10px;padding:4px}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes popIn{from{opacity:0;transform:scale(.92)}to{opacity:1;transform:scale(1)}}
@keyframes floatY{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes blobMove{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(24px,-18px) scale(1.08)}66%{transform:translate(-18px,14px) scale(.95)}}
@keyframes splashAuto{to{opacity:0;visibility:hidden}}
@keyframes shine{0%{transform:translateX(-100%)}55%{transform:translateX(100%)}100%{transform:translateX(100%)}}
@keyframes ringPop{0%{opacity:0;transform:scale(.8)}60%{transform:scale(1.04)}100%{opacity:1;transform:scale(1)}}
.anim-up{animation:fadeUp .5s cubic-bezier(.22,.9,.3,1) both}
.anim-fade{animation:fadeIn .5s ease both}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
#splash{position:fixed;inset:0;z-index:999;display:grid;place-items:center;background:radial-gradient(circle at 82% 12%,rgba(247,147,30,.5),transparent 55%),linear-gradient(135deg,#073B44,#0B7285);transition:opacity .5s,visibility .5s;animation:splashAuto .5s ease 1.6s forwards}

.splash-box{text-align:center;color:#fff}

label{display:block;font-size:12.5px;font-weight:700;margin:12px 0 6px;color:var(--text)}
input,select,textarea{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:14px;outline:none;font-size:14.5px;background:#FBFEFE;transition:.2s;color:var(--text)}
textarea{min-height:90px;resize:vertical}
input[type=file]{padding:11px;background:#fff;border-style:dashed}
input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(247,103,7,.14)}
.btn{border-radius:14px;padding:13px 18px;font-weight:800;font-size:14px;transition:.2s;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:active{transform:scale(.97)}

.btn-white{background:#fff;color:var(--teal-dark)}
.btn-ghost{background:rgba(255,255,255,.16);color:#fff;border:1px solid rgba(255,255,255,.35)}
.btn-block{width:100%}.btn-sm{padding:9px 13px;font-size:12.5px;border-radius:11px}
.mt{margin-top:14px}
.badge{display:inline-block;padding:6px 11px;border-radius:999px;font-size:11.5px;font-weight:800;white-space:nowrap}
.badge-lunas{background:var(--success-bg);color:var(--success)}
.badge-sebagian{background:var(--warning-bg);color:var(--warning)}
.badge-belum{background:var(--slate-bg);color:var(--slate)}
.badge-kat{background:var(--teal-soft);color:var(--teal-dark)}

.wt-brand b{font-size:14.5px;display:block;color:var(--teal-dark)}

.st-lunas{background:linear-gradient(135deg,#34C3A6,#0E8C7F)}

function importSnapshotWB(wb){

var mK=joined.match(/KELAS\s+(\d)\s+(PUTRA|PUTRI)/i);

var t=0,b=0,s=0;

else if(nums.length===2){t=nums[0];s=nums[1];b=t-s;}
else if(nums.length===1){t=nums[0];b=t;s=0;}

});

var nw=prompt("Nama wali untuk "+s2.nama+":",s2.waliNama==="-"?"":s2.waliNama);if(nw===null)return;

s2.waliNama=nw.trim()||s2.waliNama;s2.waliHp=normHp(nh);
addLog("Data wali "+s2.nama+" diperbarui");saveState();render();showToast("Data wali diperbarui ✅");}
if(a==="reset-pin"){var s3=state.santri.find(function(x){return x.id===btn.dataset.id;});if(!s3)return;var pin3=s3.nik.slice(-6);s3.pin=pin3;saveState();render();showToast("PIN "+s3.nama+": "+pin3);}
if(a==="delete-santri"){var s4=state.santri.find(function(x){return x.id===btn.dataset.id;});if(!s4)return;if(!confirm("Hapus santri "+s4.nama+" beserta seluruh datanya?"))return;state.santri=state.santri.filter(function(x){return x.id!==s4.id;});state.spp=state.spp.filter(function(x){return x.santriId!==s4.id;});state.items=state.items.filter(function(x){return x.santriId!==s4.id;});state.pembayaran=state.pembayaran.filter(function(x){return x.santriId!==s4.id;});saveState();render();showToast("Santri dihapus","error");}

if(a==="wipe-data"){if(!confirm("Kosongkan santri, kewajiban, dan pembayaran?"))return;state.santri=[];state.spp=[];state.items=[];state.pembayaran=[];addLog("Data dikosongkan");saveState();render();showToast("Data kosong, siap import");}
if(a==="export-akun"){var rows=[["NIS","Nama","Kelas","PIN","No WA Wali"]];state.santri.forEach(function(s){rows.push([s.nik,s.nama,s.kelas,s.pin,s.waliHp]);});var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");var b=new Blob([csv],{type:"text/csv;charset=utf-8;"});var u=URL.createObjectURL(b);var l=document.createElement("a");l.href=u;l.download="akun_wali_dqh.csv";l.click();URL.revokeObjectURL(u);showToast("CSV akun wali diunduh");}
if(a==="export-laporan"){var rows2=[["NIS","Nama","Kelas","TA","Total Kewajiban","Dibayar","Sisa","Menunggak"]];tunggakanList().forEach(function(v){rows2.push([v.s.nik,v.s.nama,v.s.kelas,v.ta,v.sum.total,v.sum.dibayar,v.sum.sisa,v.list.map(function(x){return x.label;}).join(" | ")]);});var csv2=rows2.map(function(r){return r.map(function(c){return '"'+String(c==null?"":c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");var b2=new Blob([csv2],{type:"text/csv;charset=utf-8;"});var u2=URL.createObjectURL(b2);var l2=document.createElement("a");l2.href=u2;l2.download="tunggakan_dqh.csv";l2.click();URL.revokeObjectURL(u2);showToast("CSV tunggakan diunduh");}
if(a==="export-backup"){var b3=new Blob([JSON.stringify(state,null,1)],{type:"application/json"});var u3=URL.createObjectURL(b3);var l3=document.createElement("a");l3.href=u3;l3.download="backup-dqh-"+today()+".json";l3.click();URL.revokeObjectURL(u3);showToast("Backup diunduh");}
if(a==="restore-backup"){var f=document.getElementById("fileBackup").files[0];if(!f){showToast("Pilih file backup dulu","error");return;}var fr=new FileReader();fr.onload=function(ev){try{var d=JSON.parse(ev.target.result);if(!d.santri||!d.spp)throw new Error("format");state=Object.assign(seed(),d);saveState();render();showToast("Backup dipulihkan ✅");}catch(err){showToast("File backup tidak valid","error");}};fr.readAsText(f);}
if(a==="run-import"){var fS=document.getElementById("fileSantri").files[0];if(!fS){showToast("Pilih file Excel santri","error");return;}
btn.disabled=true;btn.textContent="⏳ Memproses...";
ensureXLSX(function(){readWB(fS).then(function(wb){var nS=importSantriWB(wb);addLog("Import santri: "+nS);saveState();render();showToast("Import sukses: +"+nS+" santri. Lanjut: Import Snapshot.");}).catch(function(err){showToast("Gagal membaca file: "+err.message,"error");render();});});}
if(a==="run-snapshot"){var fSn=document.getElementById("fileSnapshot").files[0];if(!fSn){showToast("Pilih file snapshot Excel","error");return;}
btn.disabled=true;btn.textContent="⏳ Memproses snapshot...";
ensureXLSX(function(){readWB(fSn).then(function(wb){var r=importSnapshotWB(wb);saveState();render();showToast("Snapshot masuk: "+r.nSantri+" santri, "+r.nPos+" pos • Kewajiban "+rupiah(r.sumT)+" • Terbayar "+rupiah(r.sumB)+" • Sisa "+rupiah(r.sumT-r.sumB));}).catch(function(err){showToast("Gagal baca snapshot: "+err.message,"error");render();});});}
if(a==="run-pay"){var fB=document.getElementById("fileBayar").files[0];if(!fB){showToast("Pilih file Excel transaksi","error");return;}
btn.disabled=true;btn.textContent="⏳ Memproses...";
ensureXLSX(function(){readWB(fB).then(function(wb){var r=importPayWB(wb);addLog("Import transaksi: "+r.p);saveState();render();showToast("Riwayat transaksi masuk: "+r.p+" baris ("+rupiah(r.sum)+")");}).catch(function(err){showToast("Gagal membaca file: "+err.message,"error");render();});});}});
document.addEventListener("input",function(e){var act=e.target.dataset.action;if(!act)return;var q=e.target.value.toLowerCase();
if(act==="search-santri"){document.querySelectorAll("#tableSantri tbody tr").forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>=0?"":"none";});document.querySelectorAll('[data-card-group="santri"] .mcard').forEach(function(c){c.style.display=(c.dataset.searchtext||"").indexOf(q)>=0?"":"none";});}
if(act==="search-bayar"){document.querySelectorAll("#tableBayar tbody tr").forEach(function(r){r.style.display=r.textContent.toLowerCase().indexOf(q)>=0?"":"none";});document.querySelectorAll('[data-card-group="bayar"] .mcard').forEach(function(c){c.style.display=(c.dataset.searchtext||"").indexOf(q)>=0?"":"none";});}});
document.addEventListener("change",function(e){
if(e.target.id==="bayarSantri")buildTargets(e.target.value);
if(e.target.id==="bayarTarget"){var o=e.target.selectedOptions[0];var n=document.getElementById("bayarNominal");if(o&&n)n.value=o.dataset.sisa||0;}
if(e.target.id==="tarifSantriSel"){state.tarifSantri=e.target.value;saveState();render();}});
document.addEventListener("submit",function(e){var form=e.target;
if(form.dataset.form==="login-wali"){e.preventDefault();var d=Object.fromEntries(new FormData(form).entries());var s=state.santri.find(function(x){return x.nik===d.nik.trim()&&x.pin===d.pin.trim();});if(!s){showToast("NIS atau PIN salah","error");return;}state.session={role:"wali",santriId:s.id};state.waliTA=null;state.waliPage="dashboard";addLog("Wali "+s.nama+" login");saveState();render();}
else if(form.dataset.form==="login-admin"){e.preventDefault();var d2=Object.fromEntries(new FormData(form).entries());var u=state.users.find(function(x){return x.username===d2.username.trim()&&x.password===d2.password.trim();});if(!u){showToast("Username/password salah","error");return;}state.session={role:"admin"};state.page="dashboard";addLog("Admin login");saveState();render();}
else if(form.dataset.form==="add-santri"){e.preventDefault();var d3=Object.fromEntries(new FormData(form).entries());if(state.santri.some(function(x){return x.nik===d3.nik.trim();})){showToast("NIS sudah ada","error");return;}var pin=d3.pin.trim()||d3.nik.trim().slice(-6);state.santri.push({id:uid(),nik:d3.nik.trim(),nama:d3.nama.trim(),jk:d3.jk,kelas:d3.kelas,tahunAjaran:d3.tahunAjaran.trim(),waliNama:d3.waliNama.trim(),waliHp:normHp(d3.waliHp),pin:pin,status:"aktif"});saveState();render();showToast("Santri disimpan. PIN: "+pin);}
else if(form.dataset.form==="gen-ta"){e.preventDefault();var d4=Object.fromEntries(new FormData(form).entries());var ta=d4.ta.trim();var defs=[+d4.spp1,+d4.spp2,+d4.spp3];var itemDefs=ITEM_TPL_DEF.map(function(t,i){return +d4["def"+i]||t.def;});var n=0;
state.santri.filter(function(s){return s.status==="aktif";}).forEach(function(s){var cls=+s.kelas.charAt(0)||1;var tarif=defs[cls-1]||defs[0];var sp=getSpp(s.id,ta);
if(!sp){sp={id:uid(),santriId:s.id,ta:ta,tarif:tarif,months:{}};MONTHS.forEach(function(m){sp.months[m]={t:tarif,b:0};});state.spp.push(sp);}
else{sp.tarif=tarif;MONTHS.forEach(function(m){var c=sp.months[m]||{t:0,b:0};c.t=Math.max(tarif,c.b);sp.months[m]=c;});}
ITEM_TPL_DEF.forEach(function(tpl,i){if(tpl.untuk==="kelas3"&&cls!==3)return;var def=itemDefs[i];var it=state.items.find(function(x){return x.santriId===s.id&&x.ta===ta&&x.kategori===tpl.kat;});if(!it)state.items.push({id:uid(),santriId:s.id,ta:ta,nama:tpl.kat,kategori:tpl.kat,tarif:def,terbayar:0});else it.tarif=Math.max(def,it.terbayar);});n++;});
addLog("Generate TA "+ta+" untuk "+n+" santri");saveState();render();showToast("TA "+ta+": kewajiban "+n+" santri terbentuk ⚡");}
else if(form.dataset.form==="set-spp"){e.preventDefault();var sid=state.tarifSantri;if(!sid){showToast("Pilih santri dulu","error");return;}var s5=state.santri.find(function(x){return x.id===sid;});var ta5=s5?latestTA(s5.id):"";var sp5=getSpp(sid,ta5);if(!sp5){showToast("Belum ada kewajiban SPP. Generate TA atau Import Snapshot dulu.","error");return;}var d5=Object.fromEntries(new FormData(form).entries());var n5=Number(String(d5.tarif).replace(/[^0-9]/g,""));if(!n5){showToast("Nominal tidak valid","error");return;}sp5.tarif=n5;MONTHS.forEach(function(m){var c=sp5.months[m];if(c)c.t=Math.max(n5,c.b);});addLog("Tarif SPP "+s5.nama+" = "+rupiah(n5));saveState();render();showToast("Tarif SPP diterapkan ke 12 bulan ✅");}
else if(form.dataset.form==="set-items"){e.preventDefault();var inputs=document.querySelectorAll("input.item-tarif");var cnt=0;inputs.forEach(function(inp){var it=state.items.find(function(x){return x.id===inp.dataset.id;});if(!it)return;var val=Number(String(inp.value).replace(/[^0-9]/g,""));it.tarif=Math.max(val,it.terbayar);cnt++;});addLog("Tarif nonbulanan diperbarui ("+cnt+" item)");saveState();render();showToast(cnt+" tarif nonbulanan tersimpan ✅");}
else if(form.dataset.form==="add-bayar"){e.preventDefault();var sid2=document.getElementById("bayarSantri").value;var tv=document.getElementById("bayarTarget").value;var nominal=Number(document.getElementById("bayarNominal").value);var metode=document.getElementById("bayarMetode").value;var tanggal=document.getElementById("bayarTanggal").value;var ket=document.getElementById("bayarKeterangan").value;
if(!sid2||!tv){showToast("Pilih santri & kewajiban","error");return;}if(!nominal||nominal<=0){showToast("Nominal tidak valid","error");return;}
var ta3=latestTA(sid2);var nama,sisa;
if(tv.indexOf("SPP:")===0){var m=tv.split(":")[1];var sp3=getSpp(sid2,ta3);var c3=sp3&&sp3.months[m];if(!c3){showToast("Bulan tidak ditemukan","error");return;}sisa=c3.t-c3.b;if(nominal>sisa){showToast("Maksimal sisa "+rupiah(sisa),"error");return;}c3.b+=nominal;nama="SPP "+MONTH_ID[m]+" "+ta3;}
else{var it3=state.items.find(function(x){return x.id===tv.slice(5);});if(!it3){showToast("Item tidak ditemukan","error");return;}sisa=it3.tarif-it3.terbayar;if(nominal>sisa){showToast("Maksimal sisa "+rupiah(sisa),"error");return;}it3.terbayar+=nominal;nama=it3.nama;}
state.pembayaran.push({id:uid(),santriId:sid2,ta:ta3,tipe:tv.indexOf("SPP:")===0?"SPP":"ITEM",bulan:tv.indexOf("SPP:")===0?tv.split(":")[1]:undefined,refId:tv.indexOf("ITEM:")===0?tv.slice(5):undefined,nama:nama,nominal:nominal,metode:metode,tanggal:tanggal,no:noTrx()});
addLog("Pembayaran "+nama+" "+rupiah(nominal));saveState();render();showToast("Pembayaran tercatat ✅");}
else if(form.dataset.form==="add-pengumuman"){e.preventDefault();var d6=Object.fromEntries(new FormData(form).entries());state.pengumuman=state.pengumuman||[];state.pengumuman.push({id:uid(),judul:d6.judul.trim(),isi:d6.isi.trim(),tanggal:d6.tanggal,penulis:d6.penulis.trim()||"Administrasi"});saveState();render();showToast("Pengumuman terbit 📢");}
else if(form.dataset.form==="ganti-pin"){e.preventDefault();var d7=Object.fromEntries(new FormData(form).entries());var s6=state.santri.find(function(x){return x.id===state.session.santriId;});if(!s6)return;if(d7.pinBaru.length!==6||d7.pinBaru!==d7.pinUlang){showToast("PIN 6 digit & harus sama","error");return;}s6.pin=d7.pinBaru;saveState();render();showToast("PIN diganti");}});

catch(err){console.error(err);var app=document.getElementById("app");app.innerHTML='<div style="padding:24px;color:#546E7A;font-weight:700">Terjadi kesalahan saat memulai. Muat ulang halaman (refresh). Bila berulang, kirim foto layar ke developer.</div>';}

boot();
if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){});});}
